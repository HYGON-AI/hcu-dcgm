apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hcu-dcgm
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: hcu-dcgm
  template:
    metadata:
      labels:
        app: hcu-dcgm
    spec:
      hostNetwork: true
      containers:
        - name: hcu-dcgm
          image: image.sourcefind.cn:5000/dcu/admin/base/dcu-dcgm:v2.1.0
          imagePullPolicy: IfNotPresent  # 如果节点上已有镜像就不会再拉取
          command: ["/bin/bash", "-c"]
          args:
            - /usr/local/bin/start-dcgm.sh
          securityContext:
            privileged: true # 必须开启特权模式以允许容器访问设备
          ports:
            - name: dcgm-port
              containerPort: 16081
              hostPort: 16081
          volumeMounts:
            - name: kfd
              mountPath: /dev/kfd
            - name: mkfd
              mountPath: /dev/mkfd
            - name: dri
              mountPath: /dev/dri
            - name: vdev
              mountPath: /etc/vdev
            - name: hyhal
              mountPath: /opt/hyhal
          env:
            - name: LD_LIBRARY_PATH
              value: "/opt/hyhal/lib"
      volumes:
        - name: kfd
          hostPath:
            path: /dev/kfd
        - name: mkfd
          hostPath:
            path: /dev/mkfd
        - name: dri
          hostPath:
            path: /dev/dri
        - name: vdev
          hostPath:
            path: /etc/vdev
        - name: hyhal
          hostPath:
            path: /opt/hyhal

---

apiVersion: v1
kind: Service
metadata:
  name: hcu-dcgm
  namespace: kube-system
spec:
  selector:
    app: hcu-dcgm
  ports:
    - name: dcgm-port
      port: 16081
      targetPort: 16081
      protocol: TCP
  type: NodePort
